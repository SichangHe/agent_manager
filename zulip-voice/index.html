<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zulip voice · mock prototype</title>
<style>
:root{font:18px system-ui;color:#162b37;background:#edf3f5}body{max-width:740px;margin:auto;padding:20px}header{position:sticky;top:0;background:#edf3f5;padding:12px 0}h1{font-size:1.6rem;margin:0}label{display:block;margin:16px 0 6px}button,select,textarea{font:inherit;border:1px solid #90a5af;border-radius:12px;padding:14px}button{background:white;cursor:pointer;min-height:52px}button.primary{background:#135b66;color:white}button:disabled{opacity:.45;cursor:default}select,textarea{width:100%;box-sizing:border-box}textarea{min-height:130px}section{background:white;border-radius:18px;padding:18px;margin-top:16px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.note{font-size:.9rem;color:#46606e}#status{min-height:2.7em}article{border-bottom:1px solid #dae4e8;padding:12px 0;white-space:pre-wrap}article:last-child{border:0}#mode{color:#905400}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #10898c;outline-offset:3px}
</style>
<header><h1>Zulip voice</h1><p id="mode">Mock conversations · nothing goes to Zulip</p><label for="agent">Talking to</label><select id="agent"></select><div class="actions"><button id="choose">Choose agent by voice</button></div></header>
<main>
<section><div class="actions"><button id="listen">Read replies</button><button id="quiet">Stop audio</button></div><div id="messages" aria-label="Conversation"></div></section>
<section><label for="draft">Your message</label><textarea id="draft" placeholder="Tap Dictate, or use your keyboard microphone."></textarea><div class="actions"><button id="dictate" class="primary">Dictate</button><button id="stop" disabled>Finish dictating</button><button id="review">Review aloud</button><button id="send">Send mock message</button></div><p id="status" role="status" aria-live="polite">Choose an agent, then dictate a draft.</p><p class="note">Voice confirmation: after review, say “send” or “cancel”. Keep the page open. Your browser may use an online speech service.</p></section>
</main>
<script type="module">
const el = Object.fromEntries(['agent','choose','messages','draft','status','dictate','stop','review','send','listen','quiet'].map(id=>[id,document.getElementById(id)]));
const Recognition = window.isSecureContext && (window.SpeechRecognition || window.webkitSpeechRecognition);
const submissionId=()=>Array.from(crypto.getRandomValues(new Uint8Array(18)),byte=>byte.toString(16).padStart(2,'0')).join('');
let recognition, generation=0, busy=false, pending=null, conversations=[], messages=[], recording=false, loaded=false, loading=false, drafts={}, mock=true, ready=false;
const status = text=>{el.status.textContent=text;};
function controls(){el.dictate.disabled=!ready||!Recognition||busy||recording;el.choose.disabled=!ready||!Recognition||busy||recording;el.stop.disabled=!recording;el.review.disabled=!ready||busy||recording||!el.draft.value.trim();el.send.disabled=!ready||busy||recording||!el.draft.value.trim();el.agent.disabled=!ready||busy;el.draft.disabled=!ready||busy||recording;el.listen.disabled=!ready||loading;}
function cancelAudio(){generation++;recognition?.abort();recognition=null;recording=false;window.speechSynthesis?.cancel();controls();}
function speak(text,done){if(!window.speechSynthesis){status('Speech playback unavailable. You can read and send the draft.');return;}const token=generation;const utterance=new SpeechSynthesisUtterance(text);utterance.onend=()=>{if(token===generation)done?.();};utterance.onerror=()=>{if(token===generation)status('Audio stopped. Review the draft on screen.');};speechSynthesis.speak(utterance);}
function startRecognition(confirm=false){cancelAudio();if(!Recognition)return;const token=generation;const recipient=el.agent.value;const base=el.draft.value.trim();const r=new Recognition();recognition=r;r.lang=navigator.language||'en-US';r.continuous=!confirm;r.interimResults=!confirm;recording=true;controls();status(confirm?'Say “send” or “cancel”.':'Listening. Tap Finish dictating when ready.');r.onresult=event=>{if(token!==generation||recipient!==el.agent.value)return;const text=Array.from(event.results).map(result=>result[0].transcript).join(' ').trim();if(confirm){const command=text.toLowerCase().replace(/[.!?,]/g,'').trim();cancelAudio();if(command==='send')send();else status(command==='cancel'?'Draft kept. Nothing sent.':'Nothing sent. Say exactly “send”, or use the button.');}else{el.draft.value=[base,text].filter(Boolean).join(' ');pending=null;saveDraft();}};r.onend=()=>{if(token!==generation)return;recording=false;recognition=null;controls();if(!confirm)status('Draft ready. Review aloud or send.');};r.onerror=event=>{if(token===generation)status('Microphone: '+event.error+'. Use keyboard dictation if needed.');};try{r.start();}catch{recording=false;controls();status('Could not start the microphone. Use keyboard dictation.');}}
function saveDraft(){drafts[el.agent.value]={text:el.draft.value,pending};try{sessionStorage.setItem('voice-draft:'+mock,JSON.stringify({agent:el.agent.value,drafts}));}catch{status('Draft storage unavailable. Keep this page open until sending is resolved.');}}
async function api(path,body){try{const response=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(20000)});const data=await response.json();return response.ok?{data}:{error:data.error||'Request failed'};}catch{return{error:'Connection lost. Your draft is kept; retry uses the same submission ID.'};}}
function render(){el.messages.replaceChildren(...messages.map(message=>{const article=document.createElement('article');article.textContent=(message.sender==='human'?'You':conversations.find(c=>c.id===el.agent.value)?.name)+': '+message.text;return article;}));}
async function load(){const recipient=el.agent.value;loaded=false;loading=true;messages=[];render();controls();const result=await api('/api/messages?agent='+encodeURIComponent(recipient));if(recipient!==el.agent.value)return;loading=false;if(result.error){status(result.error);controls();return;}messages=result.data;loaded=true;render();controls();}
// 🧑 "talk to the interface to send messages ... which agent I am talking to"
async function send(){if(!ready||busy||!el.draft.value.trim())return;cancelAudio();const agent=el.agent.value,text=el.draft.value.trim();if(!pending||pending.agent!==agent||pending.text!==text)pending={id:submissionId(),agent,text};saveDraft();busy=true;controls();const result=await api('/api/send',pending);busy=false;if(result.error){status(result.error);controls();return;}pending=null;el.draft.value='';saveDraft();status((mock?'Mock message':'Message')+' delivered to '+conversations.find(c=>c.id===agent).name+'.');await load();controls();}
el.dictate.onclick=()=>startRecognition();
el.stop.onclick=()=>recognition?.stop();
el.quiet.onclick=()=>{cancelAudio();status('Audio stopped.');};
el.review.onclick=()=>{cancelAudio();const name=conversations.find(c=>c.id===el.agent.value)?.name;speak('To '+name+'. '+el.draft.value+(Recognition?'. Say send or cancel after the microphone starts.':'. Use the send button to send.'),()=>startRecognition(true));};
el.choose.onclick=()=>{
  cancelAudio();const token=generation;const r=new Recognition();recognition=r;r.lang=navigator.language||'en-US';recording=true;controls();status('Say an agent name: '+conversations.map(c=>c.name.replace(' (mock)','')).join(', ')+'.');
  r.onresult=event=>{if(token!==generation)return;const spoken=event.results[0][0].transcript.toLowerCase().replace(/[.!?,]/g,'').trim();const target=conversations.find(c=>[c.id,c.name.replace(' (mock)','').toLowerCase()].includes(spoken));cancelAudio();if(!target){status('Agent not recognized. Choose an agent from the list.');return;}el.agent.value=target.id;el.agent.onchange();speak('Talking to '+target.name);};
  r.onend=()=>{if(token===generation){recording=false;recognition=null;controls();}};
  r.onerror=event=>{if(token===generation)status('Microphone: '+event.error+'. Choose an agent from the list.');};
  try{r.start();}catch{recording=false;controls();status('Could not start microphone. Choose an agent from the list.');}
};
el.send.onclick=send;
el.listen.onclick=async()=>{cancelAudio();const token=generation;await load();if(token===generation&&loaded)speak(messages.filter(m=>m.sender!=='human').map(m=>m.text).join('. ')||'No replies yet.');};
el.draft.oninput=()=>{cancelAudio();pending=null;saveDraft();controls();};
el.agent.onchange=()=>{cancelAudio();const draft=drafts[el.agent.value];pending=draft?.pending||null;el.draft.value=draft?.text||'';saveDraft();status('Talking to '+conversations.find(c=>c.id===el.agent.value).name+'.');load();controls();};
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveDraft();cancelAudio();}});
controls();
const mode=await api('/api/mode');
if(!window.isSecureContext)document.querySelector('.note').textContent='IP preview: use your keyboard microphone for dictation. Browser microphone and spoken confirmation are unavailable here. Mock messages only.';
if(mode.data){mock=mode.data.mock;document.getElementById('mode').textContent=mock?'Mock conversations · nothing goes to Zulip':'Live Zulip · sends as your account';el.send.textContent=mock?'Send mock message':'Send to Zulip';document.title=mock?'Zulip voice · mock prototype':'Zulip voice';}
const result=mode.error?mode:await api('/api/conversations');
if(result.error){status(result.error);el.agent.disabled=true;}
else{
  conversations=result.data;
  ready=true;
  for(const item of conversations){const option=document.createElement('option');option.value=item.id;option.textContent=item.name;el.agent.append(option);}
  try{const saved=JSON.parse(sessionStorage.getItem('voice-draft:'+mock));if(saved&&conversations.some(c=>c.id===saved.agent)){drafts=saved.drafts||{};el.agent.value=saved.agent;el.draft.value=drafts[saved.agent]?.text||'';pending=drafts[saved.agent]?.pending||null;}}catch{}
  await load();
}
if(!Recognition)status('Browser speech recognition unavailable. Use your keyboard microphone to dictate.');
controls();
</script>
</html>
